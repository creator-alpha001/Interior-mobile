name: interiobee_design
description: Tokens, theme and shared widgets for the InterioBee mobile app.
publish_to: none

# Resolved from the workspace root, so every package shares one lockfile and
# one version of dio, freezed and intl. Without this the root `workspace:` key
# is inert and `flutter pub get` at the root refuses outright.
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # The one non-Flutter dependency: Indian digit grouping is a locale rule, not
  # a format string, and getting it wrong ships "₹450,000".
  intl: ^0.20.2

  # Catalogue and portfolio imagery, cached on disk.
  #
  # Named in MOBILE.md 4.2 from the beginning and absent from every pubspec
  # until now, which is why the app had no Image widget anywhere in it. The
  # caching is the point rather than a nicety: a professional's portfolio is
  # eight photographs, and re-fetching them on every scroll is the difference
  # between a list that moves and one that stutters on a 3G connection.
  cached_network_image: ^3.4.1

  # What a vendor writes about a job, rendered.
  #
  # Their details are HTML — the website's editor produces it and the API
  # sanitises it to a small allowlist before storing — so the phone has to
  # render the same tags rather than print the markup or drop the formatting.
  # Core only: the full package pulls in video, iframes and web view support
  # for tags the allowlist does not permit anyway.
  flutter_widget_from_html_core: ^0.15.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter, the one family the website uses too, bundled rather than fetched: a
  # vendor on a site with no signal should not get a fallback-font first paint.
  # Referenced from a text style as `fontFamily: 'Inter', package:
  # 'interiobee_design'` — see InterioBeeFonts. Licence: fonts/Inter-LICENSE.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700

  # The logo, cut from the brand artwork into the house mark and the wordmark.
  assets:
    - assets/brand/
