include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # A colour literal outside tokens.dart is the one thing that breaks the
    # promise that dark mode is later a single file.
    avoid_redundant_argument_values: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - require_trailing_commas
    - avoid_print
