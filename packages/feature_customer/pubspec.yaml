name: interiobee_feature_customer
description: The customer's shell — requirements, quotes, agreements and projects.
publish_to: none

# Resolved from the workspace root, so every package shares one lockfile and
# one version of dio, freezed and intl. Without this the root `workspace:` key
# is inert and `flutter pub get` at the root refuses outright.
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  interiobee_core_api:
    path: ../core_api
  interiobee_core_upload:
    path: ../core_upload
  interiobee_design:
    path: ../design

  flutter_riverpod: ^2.6.1

  # The requirement flow attaches photographs before the person has an account.
  image_picker: ^1.1.2

  # The draft survives the app closing. See requirement_flow.dart.
  shared_preferences: ^2.3.5

  # The referral share sheet. MOBILE.md 6.1 asks for one, and the OS sheet is
  # the right answer rather than a list of buttons: whichever app somebody
  # actually talks to their friends in is already in it, and on this audience's
  # phones that is very often WhatsApp.
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Only for the Hindi widget tests. The app composes these delegates in
  # `main.dart`; a screen pumped on its own has no MaterialLocalizations,
  # and an AppBar asserts without one.
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0
  dio: ^5.7.0

flutter:
  uses-material-design: true

# feature_vendor is deliberately NOT a dependency, and never will be.
# test/boundaries_test.dart asserts it.
