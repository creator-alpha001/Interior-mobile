# The melos workspace.
#
# Two shells over a shared core, as separate packages, so they cannot quietly
# fuse. MOBILE.md §2: splitting into two binaries later should be a build
# flavour and an entrypoint, not a rewrite — which only stays true if
# feature_customer and feature_vendor never import each other. Enforce that with
# a dependency lint in CI rather than by asking.
name: interiobee_mobile
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - app
  - packages/design
  - packages/core_api
  - packages/core_auth
  - packages/core_push
  - packages/core_upload
  - packages/feature_customer
  - packages/feature_vendor

dev_dependencies:
  melos: ^7.1.0

melos:
  scripts:
    analyze:
      run: dart analyze --fatal-infos
      exec:
        concurrency: 1

    test:
      run: flutter test
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test
        flutter: true

    # core_api has no Flutter dependency by design, so its tests run under
    # `dart test`. That is the point rather than an inconvenience: the contract
    # layer is testable without a widget tree.
    test:api:
      run: dart test
      exec:
        concurrency: 1
      packageFilters:
        scope: interiobee_core_api

    # The full contract pipeline, from the committed document to compiled Dart.
    #
    # Three steps, and the order matters. `fix_generated` sits between the two
    # generators because swagger_parser emits freezed-2 syntax and duplicates
    # our union variants; the comment at the top of that file has the detail.
    contract:
      run: >
        cd packages/core_api &&
        dart run swagger_parser &&
        dart run tool/fix_generated.dart &&
        dart run build_runner build --delete-conflicting-outputs &&
        dart format lib

    check:
      run: melos run analyze && melos run test && melos run test:api
