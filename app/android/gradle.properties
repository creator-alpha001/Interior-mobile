org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin's incremental compiler cannot cope with a project and a pub cache on
# two different Windows drives.
#
# It relativises every Kotlin source path against the module directory, and
# `C:\...\Pub\Cache\...\image_picker_android\...\Messages.kt` has no relative
# path from `D:\Interior-mobile\app\android` at all. The relativisation throws,
# the incremental caches cannot be closed, and `compileDebugKotlin` fails for
# every plugin with Kotlin sources — which is most of them.
#
# A real constraint rather than a preference: PUB_CACHE defaults to the user
# profile, and the user profile is not always on the drive the work is on.
# Non-incremental compilation is slower on a rebuild and correct everywhere.
kotlin.incremental=false
