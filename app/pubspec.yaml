name: interiobee_app
description: The Decora Shine mobile app — customer and professional in one binary.
publish_to: none

# Resolved from the workspace root, so every package shares one lockfile and
# one version of dio, freezed and intl. Without this the root `workspace:` key
# is inert and `flutter pub get` at the root refuses outright.
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Material's own strings — the date picker, the text-selection menu, the
  # back button's semantics label — in Hindi. Without it the app's copy
  # translates and the framework's does not, which reads worse than English
  # throughout because the seams are visible.
  flutter_localizations:
    sdk: flutter
  # Which language somebody chose. Not a secret, so not the keychain.
  shared_preferences: ^2.3.5
  interiobee_design:
    path: ../packages/design
  interiobee_core_api:
    path: ../packages/core_api
  interiobee_core_auth:
    path: ../packages/core_auth
  interiobee_core_push:
    path: ../packages/core_push
  interiobee_core_upload:
    path: ../packages/core_upload
  path_provider: ^2.1.5
  interiobee_feature_customer:
    path: ../packages/feature_customer
  interiobee_feature_vendor:
    path: ../packages/feature_vendor
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Used by the test stub adapter only. core_api re-exports the models but not
  # dio itself, and a test that installs an HttpClientAdapter needs the type.
  dio: ^5.7.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
