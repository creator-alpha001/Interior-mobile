name: aangan_app
description: The Aangan mobile app — customer and professional in one binary.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  aangan_design:
    path: ../packages/design
  aangan_core_api:
    path: ../packages/core_api
  aangan_core_auth:
    path: ../packages/core_auth
  aangan_core_upload:
    path: ../packages/core_upload
  aangan_feature_customer:
    path: ../packages/feature_customer
  aangan_feature_vendor:
    path: ../packages/feature_vendor
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Used by the test stub adapter only. core_api re-exports the models but not
  # dio itself, and a test that installs an HttpClientAdapter needs the type.
  dio: ^5.7.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
